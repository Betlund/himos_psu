[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "himos-psu"
version = "0.2.1"
description = "Open-source Linux monitor, fan controller and energy tracker for Segotep / Kunlun HiMOS digital power supplies (e.g. KE-1300P)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "BetLund" }]
keywords = [
    "psu",
    "power-supply",
    "energy-monitoring",
    "fan-control",
    "segotep",
    "kunlun",
    "ch340",
    "reverse-engineering",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
serial = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/Betlund/himos_psu"
Repository = "https://github.com/Betlund/himos_psu"
Issues = "https://github.com/Betlund/himos_psu/issues"
Changelog = "https://github.com/Betlund/himos_psu/blob/main/CHANGELOG.md"
Releases = "https://github.com/Betlund/himos_psu/releases"

[project.scripts]
himos-psu = "himos_psu.cli:main"
himos-psu-gui = "himos_psu.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

# The window icon is loaded relative to gui.py, so a wheel without this has no icon.
[tool.setuptools.package-data]
himos_psu = ["assets/*.svg"]
