name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pipeline (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 隐私扫描需要完整历史

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Qt runtime libraries (PySide6 offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install GUI dependency
        run: python -m pip install --quiet --disable-pip-version-check "PySide6>=6.5"

      - name: Byte-compile
        run: python -m compileall -q src tests tools

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # 与本地（UTC+8）互换时区再跑一遍：时间相关的断言两边都要成立。
      - name: Unit tests (Asia/Shanghai)
        env:
          TZ: Asia/Shanghai
        run: python -m unittest discover -s tests

      - name: Privacy scan (worktree + full history)
        run: python tools/privacy_scan.py --all

  changelog:
    name: changelog guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn when CHANGELOG is untouched
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE"
          changed="$(git diff --name-only "origin/$BASE"...HEAD)"
          if [ -z "$changed" ]; then
            echo "本次 PR 没有文件改动"
            exit 0
          fi
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "CHANGELOG.md 已更新"
          else
            echo "::warning::改了代码但没动 CHANGELOG.md，合并前记得补一条"
          fi
